__object__:
  path: depth_anything_3.model.da3_4d
  name: DepthAnything3Net
  args: as_params

net:
  __object__:
    path: depth_anything_3.model.dinov2.dinov2
    name: DinoV2
    args: as_params

  name: vitl
  out_layers: [11, 15, 19, 23]
  alt_start: 8
  qknorm_start: 8
  rope_start: 8
  cat_token: True

head:
  __object__:
    path: depth_anything_3.model.dualdpt
    name: DualDPT
    args: as_params

  dim_in: &head_dim_in 2048
  output_dim: 2
  features: &head_features 256
  out_channels: &head_out_channels [256, 512, 1024, 1024]


cam_enc:
  __object__:
    path: depth_anything_3.model.cam_enc
    name: CameraEnc
    args: as_params

  dim_out: 1024

cam_dec:
  __object__:
    path: depth_anything_3.model.cam_dec
    name: CameraDec
    args: as_params

  dim_in: 2048

# flow_head:
#   __object__:
#     path: depth_anything_3.model.flowdpt
#     name: FlowDPT
#     args: as_params

#   dim_in: 4096
#   output_dim: 2
#   features: *head_features
#   out_channels: *head_out_channels
#   activation: linear
#   use_image_context: false

raft_head:
  __object__:
    path: depth_anything_3.model.sea_raft
    name: RAFT
    args: as_params

  args:
    radius: 4
    dim: 512
    num_blocks: 2
    iters: 4
    use_var: true
    var_min: 0
    var_max: 10
    # pretrain: "resnet34"
    # initial_dim: 64
    # block_dims: [64, 128, 256]

scene_head:
  __object__:
    path: depth_anything_3.model.scene_dec_v2
    name: SceneAutoEncoder
    args: as_params

  dim_in: *head_dim_in
  token_dim: 512
  feat_res: [1,2,4,8]
  num_latents: 8  # Number of latents for the scene
  start_tokens: 100  # Number of tokens sampled for the coarsest level (multiplied by num_latents)
  densify_tokens: [100, 100, 100, 100]  # Number of tokens sampled for next level (multiplied by num_latents)
  gs_params: ['pos','scale','rot']  # 'pos','scale','rot','opac','col'

rasterize_cfg:
  chunk_size: 1
  area_target: 1.0
  area_tau: 0.5
  spread_target: 0.03
  contrib_min: 1e-4
  contrib_max: 1e-3